name: Deploy Frontend to Server

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]

concurrency:
  group: deploy-frontend
  # Never cancel a running deploy. A merge fires Frontend CI twice — once for the branch and
  # once for the push to master — so two workflow_run deploys start. The branch one is skipped
  # by the `if` below, but its concurrency claim cancelled the master one first, and the merge
  # shipped nothing at all (2026-09-08, commit 89ec294: one run `skipped`, the other
  # `cancelled`, frontend never updated). Queue instead, the same fix Backend CI took in #79.
  cancel-in-progress: false

jobs:
  # Which commit to ship (2026-10-04): the newest commit on master that passed CI, not the one
  # that triggered this run. CI runs finish out of commit order, so "ship the trigger" could land
  # an older commit last, and the server used to build whatever master was at that moment, CI or not. scripts/ci/pick_deploy_sha.py walks the branch from
  # its tip: a commit still in CI → skip (its own CI completion deploys it); passed → ship it;
  # failed/cancelled or never run (paths filter) → keep walking back.
  pick:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: scripts/ci
      - name: Pick the newest verified commit
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/pick_deploy_sha.py --self-test
          python3 scripts/ci/pick_deploy_sha.py --repo "${{ github.repository }}" --branch master \
            --ci-workflow frontend-ci.yml --trigger-sha "${{ github.event.workflow_run.head_sha }}" | tee -a "$GITHUB_OUTPUT"

  # The image is built HERE, on the runner, for exactly the sha `pick` chose, and pushed to GHCR; the
  # production host only pulls it (2026-10-27: `docker compose build` on the shared 8 GB host took
  # ~1.5 GB for the vite build, the box swapped, the kernel OOM-killed an LMS backend process and
  # every service on it failed for ~3 minutes). Built in this workflow rather than in Frontend CI
  # because only here is the sha known: `pick` may ship an older commit than the one whose CI just
  # finished, or one whose CI never ran (paths filter), so a CI-built image could not be matched to
  # the shipped sha. A job of its own so the token that goes to the host (deploy job) can only read.
  build:
    needs: pick
    if: ${{ needs.pick.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      SHA: ${{ needs.pick.outputs.sha }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}

      - name: Check the checkout is the picked sha
        run: |
          set -euo pipefail
          case "$SHA" in *[!0-9a-f]*|'') echo "bad sha '$SHA'"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "bad sha '$SHA'"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }

      - name: Compute the image name
        id: image
        run: |
          # ghcr.io requires a lowercase path; github.repository preserves the org's casing.
          REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO_LOWER}/lms-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the frontend image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # docker-compose.yml stays the one place with the build args (Sentry DSN, environment,
          # Turnstile key, release = LMS_FRONT_GIT_COMMIT), so this build is the one the server
          # used to make. It tags the result lms-frontend:latest, as the compose file says.
          LMS_FRONT_GIT_COMMIT="$SHA" docker compose build lms-frontend
          docker tag lms-frontend:latest "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"

  deploy:
    needs: [pick, build]
    if: ${{ needs.pick.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # A step-level `if: env.SENTRY_AUTH_TOKEN != ''` was tried first and was ALWAYS skipped
      # (the SAT lesson: `secrets` isn't usable that way in a step `if:`). Resolve it once here,
      # at job level, into a plain string the step below can check; the token itself is never
      # put in this job-level env, only in the one step that actually uses it.
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Read-only and dies with this job (permissions: packages: read above). Reaches the host
          # as an exported variable of the script and goes into `docker login` on stdin, never as
          # an argument, so it is not in the host's `ps`.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE
          # The image pull plus two container handovers (15 s settles each); the default is 10 min.
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Deploying frontend..."
            cd ~/projects/lms-frontend
            git config core.fileMode false
            # The production host cannot reach GitHub over SSH (port 22); use the public
            # repository's HTTPS endpoint for deployment fetches.
            git remote set-url origin https://github.com/mastereducationkz/lms-front.git
            # Check out exactly the commit the pick job verified (never master's tip, which may still
            # be in CI); checkout -B refuses, like pull did, if the server has local edits in the way.
            # The checkout only supplies docker-compose.yml and scripts/: the image is not built here.
            SHA='${{ needs.pick.outputs.sha }}'
            case "$SHA" in *[!0-9a-f]*|'') echo "❌ bad sha '$SHA'"; exit 1;; esac
            [ "${#SHA}" -eq 40 ] || { echo "❌ bad sha '$SHA'"; exit 1; }
            case "$IMAGE" in ghcr.io/*) ;; *) echo "❌ bad image '$IMAGE'"; exit 1;; esac
            git fetch origin master
            git checkout -B master "$SHA"
            # Never `docker compose build` on this host (2026-10-27 OOM, see the build job): pull the
            # image the build job pushed for $SHA and give it the tag the compose file and
            # scripts/deploy_frontend.sh run. A throwaway DOCKER_CONFIG keeps the login out of the
            # host's own ~/.docker and gone when the script ends.
            DOCKER_CONFIG_DIR="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG_DIR"' EXIT
            # Shared lock with the other deploys on this host (lms-backend's deploy-backend.yml has
            # the why): held through the pull so no other deploy's `image prune` eats its layers.
            exec 9>/var/lock/docker-content.lock
            flock -s -w 300 9
            printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$DOCKER_CONFIG_DIR" docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            echo "⬇️  Pulling $IMAGE:$SHA..."
            DOCKER_CONFIG="$DOCKER_CONFIG_DIR" docker pull "$IMAGE:$SHA"
            docker tag "$IMAGE:$SHA" lms-frontend:latest
            docker image inspect lms-frontend:latest >/dev/null
            # `up -d lms-frontend` stopped the container before the new one served (1-5 failed
            # requests per deploy) and dropped the previous build's /assets (open tabs 404'd on
            # their next lazy route). The script serves the new build from lms-frontend-standby
            # first and keeps old assets for 14 days; see its header. </dev/null: nothing in it may
            # read the rest of this script from stdin.
            bash scripts/deploy_frontend.sh </dev/null
            echo "✅ Frontend replaced without downtime"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🏥 Health check (container serves index)..."
            for i in {1..20}; do
              if docker exec lms-frontend wget -q -O /dev/null http://127.0.0.1/ 2>/dev/null; then
                echo "✅ Health check passed"; exit 0
              fi
              echo "⏳ waiting ($i/20)"; sleep 3
            done
            echo "❌ Health check failed"; docker logs --tail=100 lms-frontend || true; exit 1

      # Fix round 1 (security): the Sentry API call used to run over SSH on the production
      # server, so curl's `-H "Authorization: Bearer …"` sat in that box's own `ps` output for
      # the life of the request — visible to anything else on the shared host. It now runs on
      # this GitHub-hosted runner instead; the server is only asked for the sha it just deployed,
      # nothing more. The token still never touches a job-level `env:`, and inside
      # scripts/sentry-release.sh it's fed to curl via `--config -` on stdin, never as an argv
      # element, so it stays out of even THIS runner's own `ps`.
      #
      # Fix round 2: moved after Health check (was between "Deploy to server" and it) — a deploy
      # is now marked in Sentry only once it's confirmed healthy, and a hung SSH here no longer
      # delays the health signal. `success()` is explicit in each `if:` below because a custom
      # `if:` replaces the step's implicit "only run if every previous step succeeded" default
      # rather than adding to it; continue-on-error on the earlier steps in this chain still
      # counts as success for that check, so one of them failing doesn't skip the next.
      # `appleboy/ssh-action` pinned to v1.2.5 here specifically: v1.2.0 (used by the other two
      # steps, which don't need this) has no `capture_stdout` input and no `outputs:` at all —
      # confirmed by diffing both versions' action.yml — so `steps.deployed_sha.outputs.stdout`
      # was silently always empty, and scripts/sentry-release.sh's old `git rev-parse HEAD`
      # fallback papered over it with whatever the RUNNER's checkout resolved to instead of the
      # sha the SERVER actually deployed (those two can differ: the server builds master's tip at
      # deploy time, and deploys queue). That fallback is gone from the script now; an empty or
      # malformed capture is a skip, not a guess, and the `steps.deployed_sha.outputs.stdout !=
      # ''` check below skips the whole chain immediately when the capture is empty.
      - name: Get deployed commit
        id: deployed_sha
        if: ${{ success() && env.HAS_SENTRY_TOKEN == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          capture_stdout: true
          script: |
            cd ~/projects/lms-frontend
            # The exact sha the deployed image was built for (the "Deploy to server" step checked out
            # $SHA and pulled the image tagged $SHA; nothing has touched the checkout since). Printed behind an
            # explicit "SENTRY_SHA=" marker, not bare (fix round 3): appleboy/ssh-action's
            # entrypoint runs drone-ssh, which always appends its own success banner to the SAME
            # stdout stream capture_stdout reads — a bare `git rev-parse HEAD` arrives as
            # "<sha>\n===\n✅ Successfully executed commands to all hosts.\n===", not just a sha.
            # scripts/sentry-release.sh greps for this marker line instead of trusting the whole
            # capture to already be exactly one.
            echo "SENTRY_SHA=$(git rev-parse HEAD)"

      - name: Checkout for release script
        if: ${{ success() && env.HAS_SENTRY_TOKEN == 'true' && steps.deployed_sha.outputs.stdout != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          # The commit Frontend CI actually validated, not whatever `github.sha` resolves to on
          # a workflow_run trigger (that's the default branch tip at trigger time, not the run
          # being deployed).
          ref: ${{ needs.pick.outputs.sha }}

      - name: Sentry release + deploy marker
        # scripts/sentry-release.sh also validates the sha against ^[0-9a-f]{40}$ itself (no
        # fallback), so this step staying safe doesn't depend on the `outputs.stdout != ''` check
        # above being exhaustive — it's the same belt-and-suspenders layering as elsewhere here.
        if: ${{ success() && env.HAS_SENTRY_TOKEN == 'true' && steps.deployed_sha.outputs.stdout != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LMS_FRONT_GIT_COMMIT: ${{ steps.deployed_sha.outputs.stdout }}
        run: bash scripts/sentry-release.sh
