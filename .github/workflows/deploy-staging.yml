name: Deploy to staging

# Puts any branch on https://stage-lms.mastereducation.kz (lms-backend: docs/infra/STAGING.md,
# deploy/staging/README.md). By hand only. Built here with `--mode staging` (.env.staging: API on
# stage-lmsapi) and the «STAGING · branch · commit» badge, pushed to GHCR as staging-<sha>; the host
# only pulls it. One staging per platform: say in the team chat before you deploy over someone
# else's check.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main
  # staging-pr.yml: a PR labelled `staging`, and the return to the default branch afterwards.
  workflow_call:
    inputs:
      branch:
        type: string
        required: true


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_MODE=staging
            VITE_STAGING_BRANCH=${{ inputs.branch }}
            VITE_STAGING_COMMIT=${{ steps.sha.outputs.sha }}
          tags: ghcr.io/mastereducationkz/lms-front/lms-frontend:staging-${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=staging-frontend
          cache-to: type=gha,mode=max,scope=staging-frontend,ignore-error=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # A job of its own so the token that goes to the host can only read packages.
    permissions:
      packages: read
      deployments: write
    env:
      NETCUP_HOST: 159.195.6.160
      HAS_KEY: ${{ secrets.STAGING_DEPLOY_KEY != '' && secrets.STAGING_KNOWN_HOSTS != '' }}
      SHA: ${{ needs.build.outputs.sha }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Not configured yet
        if: env.HAS_KEY != 'true'
        run: 'echo "::warning::STAGING_DEPLOY_KEY / STAGING_KNOWN_HOSTS are not set: image pushed, nothing deployed"'

      - name: Record the deployment
        id: deployment
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$SHA" --arg branch "$BRANCH" \
              '{ref: $ref, environment: "staging", description: $branch, auto_merge: false,
                required_contexts: [], payload: {branch: $branch}}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress >/dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        # The key can run only `/root/bin/staging-deploy lms-front` on the host (forced command,
        # deploy/staging/setup.sh). "<sha> <branch>" is the ssh command; this job's token, which
        # dies with the job, goes on stdin.
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/staging_deploy
          chmod 600 ~/.ssh/staging_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/staging_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "root@$NETCUP_HOST" "$SHA $BRANCH"

      - name: Check the page
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null https://stage-lms.mastereducation.kz/
          echo "### $BRANCH @ \`${SHA:0:7}\` is on https://stage-lms.mastereducation.kz" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the deployment
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.deployment.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state="$STATE" -f environment_url="https://stage-lms.mastereducation.kz" >/dev/null
