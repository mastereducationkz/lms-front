services:
  lms-frontend:
    build:
      context: .
      args:
        # Browser DSNs are public by design: they only let a client submit events to this one
        # project. Only this (server-side) build carries it, so dev, vitest and CI stay silent.
        VITE_SENTRY_DSN: https://78089cbc888c3b0218c3707354f71c1f@o4510940554067968.ingest.de.sentry.io/4512151495049296
        VITE_SENTRY_ENVIRONMENT: production
        # Set by deploy-frontend.yml from `git rev-parse HEAD`; "unknown" leaves release unset.
        VITE_SENTRY_RELEASE: ${LMS_FRONT_GIT_COMMIT:-unknown}
    # One image for both containers below (without it compose would build one per service).
    image: lms-frontend:latest
    container_name: lms-frontend
    restart: unless-stopped
    # nginx finishes the requests in flight on SIGQUIT, then the container lingers 5 s
    # (scripts/nginx-entrypoint.sh).
    stop_grace_period: 20s
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: lms.mastereducation.kz
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: lms.mastereducation.kz
      LETSENCRYPT_EMAIL: noreply@mastereducation.kz
    volumes:
      # Previous builds' /assets, kept 14 days for tabs still running them (scripts/deploy_frontend.sh).
      - old-assets:/srv/old-assets
    networks:
      - proxy

  # The second container of a deploy (scripts/deploy_frontend.sh): the new image serves here, next
  # to lms-frontend and on the same VIRTUAL_HOST, while lms-frontend is replaced. It exists only for
  # the length of a deploy; the profile keeps a plain `docker compose up -d` from starting it.
  lms-frontend-standby:
    extends:
      service: lms-frontend
    container_name: lms-frontend-standby
    profiles: ["standby"]

volumes:
  old-assets:
    name: lms-frontend-old-assets

networks:
  proxy:
    external: true
