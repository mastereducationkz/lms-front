services:
  lms-frontend:
    build: .
    container_name: lms-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: lms.mastereducation.kz
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: lms.mastereducation.kz
      LETSENCRYPT_EMAIL: noreply@mastereducation.kz
    networks:
      - proxy

networks:
  proxy:
    external: true
