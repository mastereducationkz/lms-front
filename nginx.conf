# Link-preview bots (Telegram, WhatsApp, Facebook/Instagram, X, Slack, ...) do not run the app: they read the first HTML they
# get, which for every page of this single-page build is index.html, so a shared webinar link previewed as the LMS login
# screen. For /w/<slug> they are handed the API's preview document instead (og: title, date, speaker, the poster).
map $http_user_agent $link_preview_bot {
  default 0;
  "~*(TelegramBot|WhatsApp|facebookexternalhit|Facebot|Instagram|Twitterbot|Slackbot|LinkedInBot|Discordbot|vkShare|Viber|SkypeUriPreview|Pinterest|Applebot|Embedly|redditbot|Googlebot|bingbot)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Who may put the LMS in a frame: the LMS itself, and Google Meet (the Meet add-on side
  # panel). Nobody else, so no other site can overlay it to trick clicks. No X-Frame-Options:
  # it has no allow-list that browsers honour, and CSP frame-ancestors wins where both exist.
  # nginx drops server-level add_header in any location with its own add_header, so every
  # such location that serves HTML repeats this line (see index.html below).
  add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;

  # Hashed build assets — safe to cache forever.
  # Single Cache-Control via add_header only (no `expires`, which would emit a
  # second, redundant Cache-Control header).
  # A file this build doesn't have may belong to the build an open tab still runs: a deploy
  # used to delete it, and the tab's next lazy route 404'd (501 such 404s in 5 h, 2026-10-07).
  # scripts/deploy_frontend.sh keeps every build's assets for 14 days in /srv/old-assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @previous_builds;
  }
  location @previous_builds {
    root /srv/old-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # PWA control files — always revalidate so new deploys + SW updates propagate.
  # Every SPA route ends here through the fallback below, so it needs the frame policy too.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
  }
  # The Google Meet add-on side panel (its own Vite entry). Meet caches nothing for us, so a
  # stale copy would point at hashed assets a deploy has removed: revalidate like index.html.
  location = /meet-addon.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
  }
  location = /sw.js                { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # An open webinar's public page. People get the app; link-preview bots get the preview document (see the map above).
  location ~ ^/w/(?<og_slug>[A-Za-z0-9-]+)/?$ {
    set $og_wanted $og_slug;               # a regex capture does not survive the internal redirect; a variable does
    if ($link_preview_bot) {
      rewrite ^ /__og last;
    }
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
    try_files /index.html =404;
  }
  # The API container on the shared docker network. A variable in proxy_pass keeps nginx from resolving the name at start
  # (it must come up even when the backend is mid-deploy); if the API is unreachable the bot gets the plain app shell.
  location = /__og {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $og_api http://lms-backend:8000;
    rewrite ^ /public/og/$og_wanted break;
    proxy_pass $og_api;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = /index.html;
  }

  # SPA fallback: unknown paths return index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
