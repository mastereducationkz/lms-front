server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Who may put the LMS in a frame: the LMS itself, and Google Meet (the Meet add-on side
  # panel). Nobody else, so no other site can overlay it to trick clicks. No X-Frame-Options:
  # it has no allow-list that browsers honour, and CSP frame-ancestors wins where both exist.
  # nginx drops server-level add_header in any location with its own add_header, so every
  # such location that serves HTML repeats this line (see index.html below).
  add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;

  # Hashed build assets — safe to cache forever.
  # Single Cache-Control via add_header only (no `expires`, which would emit a
  # second, redundant Cache-Control header).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # PWA control files — always revalidate so new deploys + SW updates propagate.
  # Every SPA route ends here through the fallback below, so it needs the frame policy too.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
  }
  # The Google Meet add-on side panel (its own Vite entry). Meet caches nothing for us, so a
  # stale copy would point at hashed assets a deploy has removed: revalidate like index.html.
  location = /meet-addon.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
  }
  location = /sw.js                { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Public «Share achievement» pages (owner, 2026-10-04): rendered by the backend so WhatsApp /
  # Telegram / Instagram link previews get real Open Graph tags (an SPA route can't give them).
  # Reached over the shared docker network; the variable + resolver look lms-backend up per
  # request, so this nginx still starts while the backend container is down. X-Real-IP passes on
  # the visitor's address as nginx-proxy recorded it — the backend rate-limits by it.
  location /s/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $lms_backend http://lms-backend:8000;
    proxy_pass $lms_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    add_header Content-Security-Policy "frame-ancestors 'self' https://meet.google.com" always;
  }

  # SPA fallback: unknown paths return index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
